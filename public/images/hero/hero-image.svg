<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="goldenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#heroGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <path d="M0 50 L800 50 M0 150 L800 150 M0 250 L800 250 M0 350 L800 350 M0 450 L800 450 M0 550 L800 550 M0 650 L800 650 M0 750 L800 750" stroke="#000" stroke-width="1"/>
    <path d="M50 0 L50 800 M150 0 L150 800 M250 0 L250 800 M350 0 L350 800 M450 0 L450 800 M550 0 L550 800 M650 0 L650 800 M750 0 L750 800" stroke="#000" stroke-width="1"/>
  </g>
  
  <!-- Central illustration - Digital transformation concept -->
  <g transform="translate(400, 400)">
    <!-- Large hexagon -->
    <path d="M0,-180 L156,-90 L156,90 L0,180 L-156,90 L-156,-90 Z" 
          fill="none" 
          stroke="url(#goldenGrad)" 
          stroke-width="4"
          opacity="0.8"/>
    
    <!-- Medium hexagon -->
    <path d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z" 
          fill="none" 
          stroke="url(#goldenGrad)" 
          stroke-width="3"
          opacity="0.6"/>
    
    <!-- Inner cube -->
    <g stroke="url(#goldenGrad)" stroke-width="4" fill="none">
      <path d="M0,-60 L52,-30 L0,0 L-52,-30 Z"/>
      <path d="M-52,-30 L-52,30 L0,60 L0,0 Z"/>
      <path d="M0,0 L0,60 L52,30 L52,-30 Z"/>
    </g>
    
    <!-- Circles representing technology -->
    <circle cx="-140" cy="-80" r="25" fill="#FF6B00" opacity="0.7">
      <animate attributeName="cy" values="-80;-70;-80" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="-80" r="25" fill="#FFD700" opacity="0.7">
      <animate attributeName="cy" values="-80;-90;-80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-140" cy="80" r="25" fill="#4CAF50" opacity="0.7">
      <animate attributeName="cy" values="80;90;80" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="80" r="25" fill="#2196F3" opacity="0.7">
      <animate attributeName="cy" values="80;70;80" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Icons for tech services -->
    <!-- Code brackets -->
    <g transform="translate(-200, 0)" fill="#FF6B00">
      <text x="0" y="10" font-size="40" font-weight="bold">&lt;/&gt;</text>
    </g>
    
    <!-- Mobile device -->
    <g transform="translate(200, 0)">
      <rect x="-15" y="-40" width="30" height="60" rx="5" fill="none" stroke="#FFD700" stroke-width="2"/>
      <circle cx="0" cy="25" r="3" fill="#FFD700"/>
    </g>
    
    <!-- Cloud -->
    <g transform="translate(0, -200)" fill="#2196F3" opacity="0.7">
      <ellipse cx="-15" cy="0" rx="25" ry="15"/>
      <ellipse cx="15" cy="0" rx="25" ry="15"/>
      <ellipse cx="0" cy="-10" rx="20" ry="15"/>
      <rect x="-40" y="0" width="80" height="15"/>
    </g>
    
    <!-- Server/Network -->
    <g transform="translate(0, 200)">
      <rect x="-30" y="-20" width="60" height="15" fill="none" stroke="#4CAF50" stroke-width="2"/>
      <rect x="-30" y="0" width="60" height="15" fill="none" stroke="#4CAF50" stroke-width="2"/>
      <circle cx="-20" cy="-12" r="2" fill="#4CAF50"/>
      <circle cx="-20" cy="8" r="2" fill="#4CAF50"/>
      <circle cx="20" cy="-12" r="2" fill="#4CAF50"/>
      <circle cx="20" cy="8" r="2" fill="#4CAF50"/>
    </g>
  </g>
  
  <!-- Floating particles -->
  <circle cx="100" cy="100" r="5" fill="#FF6B00" opacity="0.5">
    <animate attributeName="cy" values="100;120;100" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="5" fill="#FFD700" opacity="0.5">
    <animate attributeName="cy" values="150;170;150" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="700" r="5" fill="#2196F3" opacity="0.5">
    <animate attributeName="cy" values="700;720;700" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="650" r="5" fill="#4CAF50" opacity="0.5">
    <animate attributeName="cy" values="650;670;650" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text -->
  <text x="400" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Transformation Digitale
  </text>
</svg>
