<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Palette -->
  <g transform="translate(400, 280)">
    <ellipse cx="-20" cy="0" rx="100" ry="80" fill="#fff" stroke="#333" stroke-width="4"/>
    <circle cx="60" cy="-40" r="25" fill="none" stroke="#333" stroke-width="3"/>
    
    <!-- Color circles -->
    <circle cx="-50" cy="-30" r="18" fill="#fa709a"/>
    <circle cx="-20" cy="-40" r="18" fill="#fee140"/>
    <circle cx="10" cy="-35" r="18" fill="#30cfd0"/>
    <circle cx="-60" cy="10" r="18" fill="#a8edea"/>
    <circle cx="-25" cy="20" r="18" fill="#ff6b6b"/>
    <circle cx="10" cy="15" r="18" fill="#4ecdc4"/>
  </g>
  
  <!-- Brush -->
  <g transform="translate(500, 250)">
    <rect x="0" y="-80" width="15" height="100" rx="2" fill="#8B4513"/>
    <path d="M-5,-80 L7.5,-90 L20,-80 L15,-70 L0,-70 Z" fill="#333"/>
  </g>
  
  <!-- Typography symbols -->
  <text x="200" y="150" font-family="serif" font-size="50" fill="#fa709a" opacity="0.3">Aa</text>
  <text x="600" y="480" font-family="serif" font-size="50" fill="#fee140" opacity="0.3">Bb</text>
  
  <text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">
    Visual Identity & Branding
