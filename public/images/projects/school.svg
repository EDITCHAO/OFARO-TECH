<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Book/Education -->
  <g transform="translate(400, 280)">
    <rect x="-100" y="-80" width="200" height="160" rx="10" fill="url(#schoolGrad)"/>
    <rect x="-95" y="-75" width="90" height="150" rx="5" fill="#fff" opacity="0.8"/>
    <rect x="5" y="-75" width="90" height="150" rx="5" fill="#fff" opacity="0.8"/>
    
    <!-- Lines on pages -->
    <line x1="-80" y1="-50" x2="-20" y2="-50" stroke="#fcb69f" stroke-width="2"/>
    <line x1="-80" y1="-30" x2="-20" y2="-30" stroke="#fcb69f" stroke-width="2"/>
    <line x1="-80" y1="-10" x2="-20" y2="-10" stroke="#fcb69f" stroke-width="2"/>
    <line x1="20" y1="-50" x2="80" y2="-50" stroke="#fcb69f" stroke-width="2"/>
    <line x1="20" y1="-30" x2="80" y2="-30" stroke="#fcb69f" stroke-width="2"/>
    <line x1="20" y1="-10" x2="80" y2="-10" stroke="#fcb69f" stroke-width="2"/>
  </g>
  
  <!-- Graduation cap -->
  <g transform="translate(400, 180)">
    <polygon points="-50,0 0,-20 50,0 0,20" fill="#4a5568"/>
    <rect x="-5" y="0" width="10" height="40" fill="#4a5568"/>
    <circle cx="0" cy="45" r="8" fill="#fcb69f"/>
  </g>
  
  <!-- Decorative elements -->
  <text x="150" y="130" font-size="40" fill="#fcb69f" opacity="0.3">📚</text>
  <text x="630" y="480" font-size="40" fill="#ffecd2" opacity="0.3">✏️</text>
  
  <text x="400" y="520" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">
    School Management System
  </text>
</svg>
