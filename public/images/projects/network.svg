<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Network nodes -->
  <g>
    <!-- Central server -->
    <circle cx="400" cy="300" r="50" fill="url(#netGrad)"/>
    
    <!-- Connected nodes -->
    <circle cx="250" cy="200" r="35" fill="#4facfe" opacity="0.7"/>
    <circle cx="550" cy="200" r="35" fill="#00f2fe" opacity="0.7"/>
    <circle cx="250" cy="400" r="35" fill="#4facfe" opacity="0.7"/>
    <circle cx="550" cy="400" r="35" fill="#00f2fe" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="400" y1="300" x2="250" y2="200" stroke="#4facfe" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="300" x2="550" y2="200" stroke="#4facfe" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="300" x2="250" y2="400" stroke="#4facfe" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="300" x2="550" y2="400" stroke="#4facfe" stroke-width="3" opacity="0.5"/>
    
    <!-- Icons in nodes -->
    <text x="400" y="315" text-anchor="middle" font-size="30" fill="#fff">🖥️</text>
    <text x="250" y="210" text-anchor="middle" font-size="20" fill="#fff">💻</text>
    <text x="550" y="210" text-anchor="middle" font-size="20" fill="#fff">📱</text>
    <text x="250" y="410" text-anchor="middle" font-size="20" fill="#fff">🖨️</text>
    <text x="550" y="410" text-anchor="middle" font-size="20" fill="#fff">☁️</text>
  </g>
  
  <!-- Signal waves -->
  <g opacity="0.3">
    <circle cx="400" cy="300" r="70" fill="none" stroke="#4facfe" stroke-width="2">
      <animate attributeName="r" values="70;100;70" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <text x="400" y="540" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">
    Network Infrastructure
  </text>
</svg>
