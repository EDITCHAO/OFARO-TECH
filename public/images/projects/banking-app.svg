<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Mobile phone -->
  <g transform="translate(400, 300)">
    <rect x="-80" y="-140" width="160" height="280" rx="15" fill="#fff" stroke="#333" stroke-width="4"/>
    <circle cx="0" cy="120" r="8" fill="#333"/>
    
    <!-- Screen content -->
    <rect x="-70" y="-120" width="140" height="220" rx="8" fill="url(#bankGrad)" opacity="0.2"/>
    
    <!-- Card icon -->
    <rect x="-50" y="-80" width="100" height="60" rx="5" fill="url(#bankGrad)" opacity="0.8"/>
    <circle cx="-30" cy="-50" r="8" fill="#fff" opacity="0.5"/>
    <circle cx="-20" cy="-50" r="8" fill="#fff" opacity="0.7"/>
    
    <!-- Bar chart -->
    <rect x="-50" y="0" width="20" height="40" fill="#11998e"/>
    <rect x="-20" y="-10" width="20" height="50" fill="#38ef7d"/>
    <rect x="10" y="-20" width="20" height="60" fill="#11998e"/>
    <rect x="40" y="10" width="20" height="30" fill="#38ef7d"/>
  </g>
  
  <!-- Dollar signs -->
  <text x="200" y="150" font-family="Arial" font-size="60" fill="#11998e" opacity="0.2">$</text>
  <text x="600" y="450" font-family="Arial" font-size="60" fill="#38ef7d" opacity="0.2">$</text>
  
  <text x="400" y="530" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">
    Banking Mobile App
  </text>
</svg>
