<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Shopping cart icon -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="120" fill="url(#ecomGrad)" opacity="0.1"/>
    <path d="M-80,-40 L-60,-40 L-40,40 L40,40 L60,-20 L-20,-20" 
          fill="none" stroke="url(#ecomGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-20" cy="60" r="8" fill="url(#ecomGrad)"/>
    <circle cx="20" cy="60" r="8" fill="url(#ecomGrad)"/>
    
    <!-- Product boxes -->
    <rect x="-30" y="-10" width="20" height="25" fill="#667eea" opacity="0.6"/>
    <rect x="-5" y="-10" width="20" height="25" fill="#764ba2" opacity="0.6"/>
    <rect x="20" y="-10" width="20" height="25" fill="#667eea" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="40" fill="#667eea" opacity="0.1"/>
  <circle cx="650" cy="500" r="60" fill="#764ba2" opacity="0.1"/>
  
  <text x="400" y="500" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#333">
    E-Commerce Platform
  </text>
</svg>
