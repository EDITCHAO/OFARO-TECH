<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="#FF6B35" opacity="0.1"/>
  
  <!-- Icon design: Abstract tech symbol -->
  <g transform="translate(10, 10)">
    <!-- Main O shape -->
    <circle cx="20" cy="20" r="15" fill="none" stroke="#FF6B35" stroke-width="3"/>
    
    <!-- Inner elements -->
    <circle cx="20" cy="20" r="8" fill="#FF6B35"/>
    <circle cx="20" cy="20" r="4" fill="white"/>
    
    <!-- Connection lines -->
    <line x1="20" y1="5" x2="20" y2="10" stroke="#FF6B35" stroke-width="2"/>
    <line x1="20" y1="30" x2="20" y2="35" stroke="#FF6B35" stroke-width="2"/>
    <line x1="5" y1="20" x2="10" y2="20" stroke="#FF6B35" stroke-width="2"/>
    <line x1="30" y1="20" x2="35" y2="20" stroke="#FF6B35" stroke-width="2"/>
  </g>
  
  <!-- Company name -->
  <text x="65" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FF6B35">OFARO</text>
  <text x="65" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#666">TECH</text>
</svg>
